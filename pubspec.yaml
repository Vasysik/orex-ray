name: orex_ray
description: "OrexRay — тёплый Xray-клиент для Android и Windows."
publish_to: "none"
version: 0.7.0+11

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.33.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  crypto: ^3.0.6
  country_flags: ^4.1.2
  file_selector: 1.0.4
  grpc: 4.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  package_info_plus: 8.3.1
  shared_preferences: ^2.5.3
  simple_icons: ^16.23.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/orexray_logo.png
    - assets/branding/orexray_monochrome.svg
