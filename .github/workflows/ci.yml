name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: orexray-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter checks / Android and Windows
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Windows release build
        run: flutter build windows --release --no-pub
      # Temporary key only for CI compilation. Never publish these APKs.
      - name: Android release build with ephemeral signing
        shell: pwsh
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP 'orexray-ci.jks'
          $password = [guid]::NewGuid().ToString('N')
          & keytool -genkeypair -noprompt -storetype PKCS12 -keystore $keyFile -alias ci -storepass $password -keypass $password -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=OrexRay CI,O=CI Only,C=US'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create CI keystore' }
          $env:OREX_ANDROID_STORE_FILE = $keyFile
          $env:OREX_ANDROID_STORE_PASSWORD = $password
          $env:OREX_ANDROID_KEY_PASSWORD = $password
          $env:OREX_ANDROID_KEY_ALIAS = 'ci'
          flutter build apk --release --split-per-abi --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Android release compilation failed' }
